<style>

  --ok:#4CC08A; --ok-soft:#14352A; --warn:#E3A84A; --warn-soft:#3A2B12; --bad:#EE6B61; --bad-soft:#3D1A1A;
  --info:#7DA8E8; --info-soft:#16294A; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0D1D37; --navy-2:#173158; --gold:#D8B260; --gold-soft:#3A3020;
  --bg:#0A1222; --surface:#121E35; --ink:#E6EBF2; --muted:#9AA6B8; --line:#26365A;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh}

.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 12.5px var(--f-body);white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.plain::before{display:none}
.chip.wrap{white-space:normal}
#reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.scan-idle{aspect-ratio:1/1;max-width:420px;width:100%;margin:0 auto;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;padding:20px;background:var(--surface)}
.scan-idle svg{width:72px;height:72px;color:var(--gold)}
.plate{border-left:5px solid #C9A24A;background:var(--surface);border-radius:var(--r);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv dd.out{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;position:relative;overflow:hidden}
.item .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted)}
.p-Urgente{background:var(--bad)} .p-Alta{background:var(--warn)} .p-Media{background:var(--info)} .p-Baja{background:var(--line)}
.s-ok{background:var(--ok)} .s-warn{background:var(--warn)} .s-bad{background:var(--bad)} .s-plain{background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .n{font:600 30px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.alert .n{color:var(--bad)} .kpi.attn .n{color:var(--warn)}
.fmtgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.fmt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.fmt header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fmt .pt{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.fmt .pt:last-child{border-bottom:0}
.fmt .pt .body{flex:1;min-width:0}
.fmt .pt .m{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.out{color:var(--bad);font-weight:700}
tr.alerta td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.ph-in{display:flex;flex-direction:column;gap:8px}
.ph-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:var(--bg);font-weight:600;color:var(--muted)}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba figure{margin:0}
.ba img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--bg);border:1px solid var(--line)}

.noph{aspect-ratio:4/3;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px}
.sig{border:1.5px solid var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:160px;display:block}
.sig-img{background:#fff;border-radius:6px;border:1px solid var(--line);max-height:70px;max-width:200px;padding:3px}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px 1fr;gap:10px;padding-bottom:12px;position:relative;font-size:14px}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px;margin-left:3px}
.tl li::after{content:"";position:absolute;left:7px;top:17px;bottom:0;width:2px;background:var(--line)}

.sheet-bg{position:fixed;inset:0;background:#0A122299;z-index:50;display:flex;align-items:flex-end;justify-content:center}

.spark{width:100%;height:110px;display:block}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px;margin-bottom:12px}

/* Impresión del formato oficial */
#printArea{display:none}
@media print{
  @page{size:letter landscape;margin:9mm}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}

}
.pf{font:10px/1.25 Arial,sans-serif;color:#000;background:#fff}

  else if (c.t === 'firma') h = `<div class="stack" style="gap:6px"><span class="eyebrow">${esc(c.l)}</span><input type="text" id="${id}_n" placeholder="Nombre de quien firma" data-k="${c.k}Nombre"><canvas class="sig" id="${id}" aria-label="${esc(c.l)}"></canvas><button type="button" class="btn ghost sm" data-limpiar="${c.k}" style="align-self:flex-start">Borrar firma</button></div>`;

function htmlFormulario(fmt, punto) {

  const flush = () => { if (grupo !== null) html += `<div class="grp"><div class="eyebrow">${esc(grupo)}</div><div class="gfields">${buf.join('')}</div></div>`; buf = []; };
  F.campos.forEach(c => {
    if ((c.g || null) !== grupo) { flush(); grupo = c.g || null; }
    if (grupo === null) html += htmlCampo(c, punto); else buf.push(htmlCampo(c, punto));
  });
  flush();
  return html;
}
function montarFormulario(root, fmt, punto) {
  const F = FORMATOS[fmt]; const pads = {};
  F.campos.filter(c => c.t === 'firma').forEach(c => { pads[c.k] = firmaPad($('#f_' + c.k, root)); });
  root.querySelectorAll('[data-limpiar]').forEach(b => b.onclick = () => pads[b.dataset.limpiar].limpiar());

      else if (c.t === 'txt' || c.t === 'area') d[c.k] = $('#' + id, root).value.trim();
      else if (c.t === 'sel' || c.t === 'bool') { const s = root.querySelector(`input[name="${id}"]:checked`); d[c.k] = s ? s.value : ''; }
      else if (c.t === 'checks') d[c.k] = [...root.querySelectorAll(`input[name="${id}"]:checked`)].map(x => x.value);
      else if (c.t === 'firma') { d[c.k] = pads[c.k].vacio() ? '' : pads[c.k].png(); d[c.k + 'Nombre'] = $('#' + id + '_n', root).value.trim(); }

    return d;

  const refrescar = () => {

    F.campos.filter(c => c.t === 'num' || c.t === 'int').forEach(c => {

    const al = evaluar(fmt, punto, d); const box = $('#fAlertas', root);
    if (box) box.innerHTML = al.length ? al.map(a => `<span class="chip bad wrap">${esc(a)}</span>`).join('') + `<span class="hint">Se avisará a Seguridad e Higiene y a Mantenimiento al guardar.</span>` : '';
  };
  root.addEventListener('input', refrescar); root.addEventListener('change', refrescar); refrescar();
  return { leer };
}
function valorTxt(c, punto, d) {

async function firmarLote(ids, despues) {

  catch (e) { toast(e.message, true); }
}

/* ---------- Bitácoras por formato y mes, con impresión del formato oficial ---------- */
function columnasDe(fmt, conPunto) {
  const F = FORMATOS[fmt];
  return [{ h: 'Fecha', v: r => fDia(r.fecha) }, { h: 'Hora', v: r => fHora(r.fecha) }]
    .concat(conPunto ? [{ h: F.colPunto || 'Punto', v: r => r.puntoId }, { h: 'Ubicación', v: r => r.ubicacion }] : [])
    .concat(F.campos.map(c => ({ h: c.col || c.l, c, v: r => { const t = valorTxt(c, puntoDe(r.puntoId), r.datos); return t === '—' ? '' : t; } })));
}
async function vBitacoras(v) {
  const fmt0 = S.verFormato || ORDEN_FORMATOS[0]; S.verFormato = null;
  const sedes = [...new Set(S.puntos.map(p => p.sede).filter(Boolean))];
  const mesAct = new Date().toISOString().slice(0, 7);
  v.innerHTML = `
  <div class="head"><div><div class="eyebrow">Consulta, revisión e impresión</div><h1>Bitácoras</h1></div>
    <div class="row"><button class="btn ghost sm" id="bCsv">Exportar CSV</button><button class="btn sm" id="bPrint">Imprimir formato</button></div></div>
  <div class="filters">
    <select id="fFmt" aria-label="Formato">${ORDEN_FORMATOS.map(f => `<option value="${f}" ${f === fmt0 ? 'selected' : ''}>${esc(f.startsWith('FO') ? f.replace('FO-SLH-', '') + ' · ' : '')}${esc(FORMATOS[f].corto)}</option>`).join('')}</select>
    <select id="fSede" aria-label="Sede"><option value="">Todas las sedes</option>${sedes.map(s => `<option>${esc(s)}</option>`).join('')}</select>
    <select id="fPunto" aria-label="Punto"></select>
    <input type="month" id="fMes" value="${mesAct}" aria-label="Mes">
    <label class="chk"><input type="checkbox" id="fAl">Solo con alertas</label>
  </div>
  <div id="res"><div class="muted">Cargando…</div></div>`;
  let filas = [];
  const llenarPuntos = () => { const f = $('#fFmt').value; const ps = S.puntos.filter(p => p.formato === f); $('#fPunto').innerHTML = `<option value="">${FORMATOS[f].libre ? 'Todas las áreas' : 'Todos los puntos'}</option>` + ps.map(p => `<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.ubicacion)}</option>`).join(''); $('#fPunto').hidden = !ps.length; };
  const cargar = async () => {
    const f = $('#fFmt').value; const [y, m] = $('#fMes').value.split('-').map(Number);
    const desde = new Date(y, m - 1, 1).toISOString(), hasta = new Date(y, m, 1).toISOString();
    $('#res').innerHTML = '<div class="muted">Cargando…</div>';
    const r = await api('registros', { formato: f, desde, hasta, limit: 5000 });
    const sede = $('#fSede').value, pt = $('#fPunto').value, al = $('#fAl').checked;
    filas = r.filter(x => (!sede || x.sede === sede) && (!pt || x.puntoId === pt) && (!al || x.alertas.length)).sort((a, b) => a.fecha.localeCompare(b.fecha));
    const conPunto = !FORMATOS[f].libre && !pt;
    const cols = columnasDe(f, conPunto);
    const pend = filas.filter(x => !x.revisadoPor);
    $('#res').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="muted">${filas.length} registros · ${pend.length} por firmar de revisión</span>${pend.length ? `<button class="btn ok sm" id="bFirmarMes">Firmar revisión de ${pend.filter(x => !x.alertas.length).length} sin alertas</button>` : ''}</div>` +
      (filas.length ? `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.h)}</th>`).join('')}<th>Realizó</th><th>Revisó</th></tr></thead><tbody>
      ${filas.map(x => `<tr class="click ${x.alertas.length ? 'alerta' : ''}" data-reg="${esc(x.id)}">${cols.map(c => `<td class="${c.c && (c.c.t === 'num' || c.c.t === 'int') ? 'num' : ''} ${c.c && fueraDe(c.c, puntoDe(x.puntoId), x.datos) ? 'out' : ''}">${esc(c.v(x)).slice(0, 140)}</td>`).join('')}<td>${esc(x.usuarioNombre)}</td><td>${x.revisadoPor ? esc(x.revisorNombre) : '<span class="chip info">Pendiente</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">No hay registros de este formato en el periodo.</div>`);
    $('#res').querySelectorAll('[data-reg]').forEach(t => t.onclick = () => abrirRegistro(filas.find(x => x.id === t.dataset.reg), cargar));
    const bfm = $('#bFirmarMes'); if (bfm) bfm.onclick = () => firmarLote(pend.filter(x => !x.alertas.length).map(x => x.id), cargar);
  };
  $('#fFmt').onchange = () => { llenarPuntos(); cargar(); };
  ['fSede', 'fPunto', 'fMes', 'fAl'].forEach(id => $('#' + id).onchange = cargar);
  $('#bCsv').onclick = () => { const f = $('#fFmt').value; const cols = columnasDe(f, !FORMATOS[f].libre); descargarCSV(`${f}_${$('#fMes').value}.csv`, [cols.map(c => c.h).concat(['Alertas', 'Realizó', 'Revisó', 'Fecha de revisión', 'Folio ticket']), ...filas.map(x => cols.map(c => c.v(x)).concat([x.alertas.join(' | '), x.usuarioNombre, x.revisorNombre, x.fechaRevision ? fmtFecha(x.fechaRevision) : '', x.folio]))]); };
  $('#bPrint').onclick = () => imprimirFormato($('#fFmt').value, filas, $('#fMes').value, $('#fSede').value, $('#fPunto').value);
  llenarPuntos(); await cargar();
}
function imprimirFormato(fmt, filas, mes, sede, pt) {
  const F = FORMATOS[fmt]; const conPunto = !F.libre && !pt; const cols = columnasDe(fmt, conPunto);
  const [y, m] = mes.split('-').map(Number);
  const mesTxt = new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  const p = pt ? puntoDe(pt) : null;
  const firmaC = F.campos.find(c => c.t === 'firma');
  $('#printArea').innerHTML = `<div class="pf">
    <div class="ph"><div class="org">Saint Luke's<small>HOSPITALS</small></div><div class="ttl"><div class="c">${esc(F.sinCodigo ? 'Registro interno' : fmt)}</div><b>${esc(F.titulo)}</b></div></div>
    <div class="meta"><span>Mes y año: ${esc(mesTxt)}</span>${sede ? `<span>Sede: ${esc(sede)}</span>` : ''}${p ? `<span>${esc(F.colPunto || 'Punto')}: ${esc(p.id)} · ${esc(p.ubicacion)}</span>` : ''}</div>
    <table><thead><tr>${cols.filter(c => !c.c || c.c.t !== 'firma').map(c => `<th>${esc(c.h)}</th>`).join('')}${firmaC ? `<th>${esc(firmaC.col)}</th>` : ''}<th>Nombre y firma quien realizó</th><th>Nombre y firma quien revisó</th></tr></thead><tbody>
    ${filas.map(x => `<tr>${cols.filter(c => !c.c || c.c.t !== 'firma').map(c => `<td class="${c.c && fueraDe(c.c, puntoDe(x.puntoId), x.datos) ? 'out' : ''}">${esc(c.v(x))}</td>`).join('')}
      ${firmaC ? `<td>${esc(x.datos[firmaC.k + 'Nombre'] || '')}<br>${firmaImg(x.datos[firmaC.k])}</td>` : ''}
      <td>${esc(x.usuarioNombre)}<br>${firmaImg(x.firmaRealizo)}</td><td>${x.revisadoPor ? esc(x.revisorNombre) + '<br>' + firmaImg(x.firmaReviso) : ''}</td></tr>`).join('') || `<tr><td colspan="${cols.length + 3}">Sin registros en el periodo.</td></tr>`}
    </tbody></table>
    <div class="foot">${F.nota ? esc(F.nota) + ' ' : ''}Registro electrónico con fecha y hora del servidor y firma de quien realizó y revisó. Generado ${fmtFecha(new Date().toISOString())} desde Mantenimiento SLH.</div></div>`;
  document.body.classList.add('printing');
  const fin = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', fin); };
  window.addEventListener('afterprint', fin);
  setTimeout(() => { window.print(); setTimeout(fin, 1500); }, 300);
}

/* ---------- Puntos de revisión y etiquetas QR ---------- */
function urlPunto(id) { return location.origin + location.pathname + '?eq=' + encodeURIComponent(id); }
async function vPuntos(v) {
  const r = await api('registros', { desde: new Date(Date.now() - 45 * 864e5).toISOString(), limit: 5000 });
  v.innerHTML = `
  <div class="head noprint"><div><div class="eyebrow">Catálogo</div><h1>Puntos de revisión y QR</h1><p class="muted" style="margin:4px 0 0">Cada punto tiene su etiqueta QR y abre su bitácora: un manifold, un minisplit, la planta, la cisterna o un cilindro.</p></div>
    <div class="row"><button class="btn ghost sm" id="bEtiq">Etiquetas para imprimir</button><button class="btn gold sm" id="bNuevo">Agregar punto</button></div></div>
  <div class="tbl-wrap noprint"><table><thead><tr><th>ID</th><th>Punto</th><th>Bitácora</th><th>Sede · ubicación</th><th>Frecuencia</th><th>Estado</th><th></th></tr></thead><tbody>
  ${ORDEN_FORMATOS.flatMap(f => S.puntos.filter(p => p.formato === f)).map(p => { const u = r.find(x => x.puntoId === p.id); const s = estadoPunto(p, u); return `<tr><td class="mono" style="white-space:nowrap">${esc(p.id)}</td><td>${esc(p.nombre)}</td><td><span class="code">${esc(codigoDe(p.formato))}</span><div class="muted" style="font-size:13px">${esc(FORMATOS[p.formato].corto)}</div></td><td>${esc(p.sede)}<div class="muted" style="font-size:13px">${esc(p.ubicacion)}</div></td><td style="white-space:nowrap">${txtFreq(frecuenciaDe(p))}</td><td>${p.activo === false ? '<span class="chip plain">Inactivo</span>' : `<span class="chip ${s.c}">${s.t}</span>`}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn ghost sm" data-ver="${esc(p.id)}">Abrir</button><button class="btn ghost sm" data-ed="${esc(p.id)}">Editar</button></div></td></tr>`; }).join('')}
  </tbody></table></div>
  <div id="etiq"></div>`;
  v.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => abrirPunto(b.dataset.ver));
  v.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editarPunto(puntoDe(b.dataset.ed)));
  $('#bNuevo').onclick = () => editarPunto(null);
  $('#bEtiq').onclick = () => {
    const box = $('#etiq');
    box.innerHTML = `<div class="head noprint" style="margin-top:20px"><h2>Etiquetas</h2><button class="btn sm" id="bPrintE">Imprimir</button></div>
    <p class="muted noprint" style="margin-top:0">Cada código abre la bitácora del punto en esta app. Imprime en papel adhesivo y enmica las que van en zonas húmedas.</p>
    <div class="labels">${S.puntos.filter(p => p.activo !== false).map(p => `<div class="label"><small>${esc(CONFIG.ORG)} · Mantenimiento</small><div class="qr" data-qr="${esc(p.id)}"></div><div class="lid">${esc(p.id)}</div><b>${esc(p.nombre)}</b><small>${esc(p.ubicacion)}</small><small>${esc(codigoDe(p.formato))}</small></div>`).join('')}</div>`;
    box.querySelectorAll('[data-qr]').forEach(el => { if (typeof QRCode !== 'undefined') new QRCode(el, { text: urlPunto(el.dataset.qr), width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M }); else el.textContent = urlPunto(el.dataset.qr); });
    $('#bPrintE').onclick = () => window.print();
    box.scrollIntoView({ behavior: 'smooth' });
  };
}
function editarPunto(p) {
  const nuevo = !p; p = p || { id: '', nombre: '', formato: 'FO-SLH-MTO-005', sede: S.user.sede || '', ubicacion: '', unidad: 'psi', limites: {}, frecuenciaHoras: '', activo: true };
  const limitesHTML = fmt => {
    const cs = FORMATOS[fmt].campos.filter(c => c.t === 'num' || c.t === 'int');
    if (!cs.length) return '<p class="hint" style="margin:0">Este formato no tiene lecturas numéricas.</p>';
    return `<div class="tbl-wrap"><table><thead><tr><th>Lectura</th><th>Mínimo</th><th>Máximo</th></tr></thead><tbody>${cs.map(c => { const L = (p.limites && p.limites[c.k]) || c.lim || ['', '']; return `<tr><td>${esc(c.g ? c.g + ' · ' + c.l : c.l)} <span class="muted">${esc(unidadDe(c, p))}</span></td><td><input type="number" step="any" data-lmin="${c.k}" value="${esc(L[0] ?? '')}" style="min-width:80px"></td><td><input type="number" step="any" data-lmax="${c.k}" value="${esc(L[1] ?? '')}" style="min-width:80px"></td></tr>`; }).join('')}</tbody></table></div><p class="hint" style="margin:0">Fuera de estos valores se genera una alerta. Deja en blanco lo que no tenga límite.</p>`;
  };
  sheet(`<h2>${nuevo ? 'Agregar punto de revisión' : 'Editar ' + esc(p.id)}</h2>
  <form id="fPt" class="stack" style="margin-top:12px">
    <div class="grid2">
      <label class="f">ID (va en el QR)<input type="text" id="pId" value="${esc(p.id)}" ${nuevo ? '' : 'readonly'} required placeholder="SLH-AC-04" autocapitalize="characters"></label>
      <label class="f">Nombre<input type="text" id="pNom" value="${esc(p.nombre)}" required placeholder="Minisplit 12,000 BTU"></label>
      <label class="f">Bitácora que se llena<select id="pFmt">${ORDEN_FORMATOS.filter(f => !FORMATOS[f].libre).map(f => `<option value="${f}" ${f === p.formato ? 'selected' : ''}>${esc(codigoDe(f))} · ${esc(FORMATOS[f].corto)}</option>`).join('')}</select></label>
      <label class="f">Frecuencia de revisión (horas) <small>Vacío = la del formato; 0 = según se requiera</small><input type="number" id="pFrec" value="${esc(p.frecuenciaHoras)}" min="0"></label>
      <label class="f">Sede<input type="text" id="pSede" value="${esc(p.sede)}" required></label>
      <label class="f">Ubicación<input type="text" id="pUbi" value="${esc(p.ubicacion)}" required></label>
      <label class="f" id="pUniBox">Unidad de presión<select id="pUni">${['psi', 'kg/cm²', 'bar', 'kPa'].map(u => `<option ${u === p.unidad ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
    </div>
    <div class="stack" style="gap:8px"><span class="eyebrow">Rangos de alerta</span><div id="pLim"></div></div>
    <label class="chk"><input type="checkbox" id="pAct" ${p.activo !== false ? 'checked' : ''}>Punto activo</label>
    <button class="btn gold block">Guardar punto</button></form>`, (bg, close) => {
    const sync = () => { const f = $('#pFmt', bg).value; $('#pUniBox', bg).hidden = f !== 'PRESION'; $('#pLim', bg).innerHTML = limitesHTML(f); };
    $('#pFmt', bg).onchange = () => { p.limites = {}; sync(); }; sync();
    $('#fPt', bg).onsubmit = async ev => {
      ev.preventDefault();
      const lim = {}; bg.querySelectorAll('[data-lmin]').forEach(i => { const k = i.dataset.lmin; const mx = bg.querySelector(`[data-lmax="${k}"]`).value; if (i.value !== '' || mx !== '') lim[k] = [i.value === '' ? '' : Number(i.value), mx === '' ? '' : Number(mx)]; });
      try { await api('guardarPunto', { id: $('#pId', bg).value, nombre: $('#pNom', bg).value, formato: $('#pFmt', bg).value, sede: $('#pSede', bg).value, ubicacion: $('#pUbi', bg).value, unidad: $('#pFmt', bg).value === 'PRESION' ? $('#pUni', bg).value : '', limites: lim, frecuenciaHoras: $('#pFrec', bg).value === '' ? '' : Number($('#pFrec', bg).value), activo: $('#pAct', bg).checked });
        await cargarBase(); close(); toast('Punto guardado'); go('puntos'); }
      catch (err) { toast(err.message, true); }
    };
  });
}

boot();
</script>
</body>
